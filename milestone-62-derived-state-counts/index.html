<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Milestone 62 - Derived State and Counts</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <section class="skill-card">
        <h1>Complete Skill Manager</h1>

        <form id="skill-form">
          <label for="skill-input">New skill</label>
          <input id="skill-input" type="text" />
          <button type="submit">Add Skill</button>
        </form>

        <section class="summary-card">
          <h2>Summary</h2>
          <p id="total-count">Total: 0</p>
          <p id="complete-count">Complete: 0</p>
          <p id="in-progress-count">In Progress: 0</p>
        </section>

        <div id="skill-container"></div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
